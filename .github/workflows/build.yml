name: Build Wahyu Trade Viewer

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Extract source
    run: |
      unzip src.zip -d extracted
      mkdir -p src
      cp -r extracted/* src/

  - name: Build mod
    run: gradle build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: WahyuTradeViewer-JAR
      path: build/libs/*.jar
