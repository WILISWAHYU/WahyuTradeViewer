name: Build Wahyu Trade Viewer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source code
        run: |
          mkdir -p source-archive
          unzip src.zip -d source-archive

          if [ -d source-archive/src ]; then
            cp -a source-archive/src ./src
          else
            mkdir -p src
            cp -a source-archive/. ./src/
          fi

      - name: Build Minecraft mod
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WahyuTradeViewer-JAR
          path: build/libs/*.jar
